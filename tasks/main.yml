---
- name: main.yml | Check the role inputs
  ansible.builtin.assert:
    that:
      - nixos_ssh_public_key | length > 0
      - nixos_ssh_private_key | length > 0
      - nixos_bootstrap_root_password | length > 0
      - nixos_root_password | length > 0
    fail_msg: >-
      Pass nixos_ssh_public_key, nixos_ssh_private_key, nixos_bootstrap_root_password
      and nixos_root_password (from Bitwarden).
    quiet: true

- name: main.yml | Connect to the host
  ansible.builtin.include_tasks: connect.yml

- name: main.yml | Install NixOS from the live installer
  ansible.builtin.include_tasks: install.yml
  when: nixos_live | bool

- name: main.yml | Configure the installed system
  ansible.builtin.include_tasks: configure.yml
