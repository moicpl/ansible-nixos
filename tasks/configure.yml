---
- name: configure.yml | Configure NixOS
  become: true
  block:
    # stateVersion stays the one the system was installed with
    - name: configure.yml | Read the current configuration
      ansible.builtin.slurp:
        src: /etc/nixos/configuration.nix
      register: nixos_current_config
      when: nixos_state_version | length == 0

    - name: configure.yml | Keep the installed state version
      ansible.builtin.set_fact:
        nixos_state_version: >-
          {{ nixos_current_config.content | b64decode
             | regex_search('system\.stateVersion\s*=\s*"([^"]+)"', '\1') | first }}
      when: nixos_state_version | length == 0

    - name: configure.yml | Write the NixOS configuration
      ansible.builtin.include_tasks: files.yml
      vars:
        nixos_files_root: ""

    # Starting new containers pulls their images, which can take a while
    - name: configure.yml | Apply the configuration with nixos-rebuild
      ansible.builtin.command:
        argv:
          - nixos-rebuild
          - switch
      async: 3600
      poll: 15
      changed_when: true
      when: nixos_files_changed | bool or nixos_rebuild_force | bool

    - name: configure.yml | Check that the containers are running
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "podman-{{ item }}.service"
      loop: "{{ nixos_containers.keys() | list }}"
      register: nixos_container_state
      changed_when: false
      until: nixos_container_state.rc == 0
      retries: 60
      delay: 10

# By name, and by the address used in this run when it differs (a new FQDN may
# not resolve until the machine is on its final network)
- name: configure.yml | Show how to reach the services
  ansible.builtin.debug:
    msg: "{{ nixos_service_lines | from_json }}"
  vars:
    nixos_service_hosts: "{{ [inventory_hostname] + ([ansible_host] if ansible_host | default(inventory_hostname) != inventory_hostname else []) }}"
    nixos_service_lines: >-
      {% set lines = [] %}
      {% for service in [{'name': 'SSH', 'scheme': 'ssh', 'user': nixos_admin_user ~ '@', 'port': 22}] + nixos_services %}
      {%   set urls = [] %}
      {%   for host in nixos_service_hosts %}
      {%     set _ = urls.append(service.scheme ~ '://' ~ service.user | default('') ~ host ~ ':' ~ service.port ~ service.path | default('')) %}
      {%   endfor %}
      {%   set _ = lines.append(service.name ~ ': ' ~ urls | join('  or  ')) %}
      {% endfor %}
      {{ lines | to_json }}
